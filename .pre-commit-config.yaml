default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: local
    hooks:
      - id: fmt
        name: fmt (oxfmt --check)
        entry: pnpm fmt:check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: lint
        name: lint (oxlint)
        entry: pnpm lint
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: typecheck (tsc, all packages)
        entry: pnpm typecheck
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: test
        name: test (vitest + 100% coverage)
        entry: pnpm test
        language: system
        stages: [pre-commit, pre-push]
        pass_filenames: false
        always_run: true
